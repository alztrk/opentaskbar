[workspace]
resolver = "3"
members = [
    "crates/opentaskbar-core",
    "crates/opentaskbar-shell",
    "crates/opentaskbar-app",
]

[workspace.package]
# Application and crate version are the same. Bump here, in
# packaging/msix/AppxManifest.Rust.xml and in the release tag together;
# scripts/check-release-version.ps1 enforces the three-way match.
version = "0.3.5"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/alztrk/opentaskbar"

[workspace.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }
image = { version = "0.25", default-features = false }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = { version = "1", features = ["preserve_order"] }
smallvec = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
windows = { version = "0.61", features = [
    # WS-B: WinRT Start-menu/MSIX identity (Windows.ApplicationModel) and radio
    # toggles (Windows.Devices.Radios). Kept in the workspace root so every
    # crate can opt in without editing this file again.
    "ApplicationModel",
    "Data_Xml_Dom",
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Devices_Radios",
    "Foundation",
    "Foundation_Numerics",
    "Graphics",
    "Graphics_DirectX",
    "Graphics_Effects",
    "Media_Control",
    "Storage_Streams",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "UI_Composition_Effects",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_WinRT_Graphics_Direct2D",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.61"
windows-numerics = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
