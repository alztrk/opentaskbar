<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinamik Ada · OpenTaskbar</title>
<style>
  :root {
    color-scheme: light;
    font-family: "Segoe UI", sans-serif;
    --paper: #eef2f7;
    --ink: #20242c;
    --muted: #525c6a;
    --line: #d9e0e9;
    --surface: #f9fbfe;
    --blue: #005fb8;
    --panel: #101217;
    --panel-raised: #181b22;
    --panel-line: #333843;
    --white: #fafafa;
    --dim: #b7b8c1;
    --accent: #c2d9ff;
    --island-compact-height: 50px;
    --island-open-height: 246px;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --motion: 220ms cubic-bezier(.23,1,.32,1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); }
  button, select, input { font: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  [hidden] { display: none !important; }
  main { width: min(1352px, 100%); margin: auto; padding: 0 clamp(16px, 4vw, 64px) 36px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 58px; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 600; font-size: .9rem; display: flex; align-items: center; gap: 9px; }
  .brand::before { content: ""; width: 17px; height: 14px; border: 2px solid var(--blue); border-radius: 4px; background: linear-gradient(var(--blue),var(--blue)) center 80% / 9px 2px no-repeat; }
  .tag, .hint { color: var(--muted); font-size: .86rem; }
  .intro { margin: 28px 0 24px; }
  h1 { margin: 0; font-size: clamp(1.85rem, 4vw, 2.7rem); line-height: 1.15; letter-spacing: -.035em; font-weight: 650; }
  .screens { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
  .monitor { min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: 0 2px 5px #233b5710; }
  .monitor-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 2px 2px 12px; }
  h2 { font-size: .95rem; font-weight: 600; margin: 0; }
  .monitor-heading h2 { display: flex; align-items: center; gap: 7px; }
  .monitor-heading .icon { color: var(--blue); }
  .desktop {
    --island-shoulder: 12px;
    position: relative; min-height: 352px; padding: 0 calc(var(--island-shoulder) + 2px) 58px;
    border: 1px solid #263957; border-radius: 8px; isolation: isolate;
    background:
      radial-gradient(ellipse at 116% 119%, #172650 23%, #304f98 34%, #90b3fb 45%, #304e86 53%, transparent 72%),
      radial-gradient(ellipse at 11% 125%, #a2c1ed 0%, #366094 38%, transparent 68%),
      linear-gradient(142deg, #172941, #2e4b76 62%, #7199c7);
  }
  .monitor:nth-child(2) .desktop {
    background:
      radial-gradient(ellipse at -15% 114%, #142d46 19%, #2e6985 38%, #a4ced7 49%, #42849a 57%, transparent 76%),
      radial-gradient(ellipse at 100% 112%, #7caab6 0%, #325e75 48%, transparent 75%),
      linear-gradient(150deg, #24394d, #315176 68%, #7ea9bc);
  }
  .island {
    position: relative;
    display: flex; flex-direction: column;
    width: min(320px, 100%); height: var(--island-compact-height); max-height: var(--island-compact-height); margin: 0 auto; color: var(--white); background: var(--panel);
    --widget-accent: var(--accent);
    border-radius: 0 0 17px 17px;
    box-shadow: 0 16px 30px -10px #040811a6, inset 0 -1px #ffffff12;
    transition: width var(--motion), height var(--motion), border-radius var(--motion); touch-action: pan-y;
  }
  .island::before, .island::after {
    content: ""; position: absolute; top: 0; pointer-events: none;
    width: var(--island-shoulder); height: var(--island-shoulder);
    background: radial-gradient(circle at left bottom, transparent calc(var(--island-shoulder) - 0.5px), var(--panel) var(--island-shoulder));
  }
  .island::before { right: 100%; }
  .island::after { left: 100%; scale: -1 1; }
  .island[data-open="true"] { width: min(100%, 416px); height: var(--island-open-height); max-height: var(--island-open-height); border-radius: 0 0 22px 22px; }
  .island-header, .page { cursor: grab; user-select: none; }
  .island[data-dragging="true"] :is(.island-header, .toggle, .page) { cursor: grabbing; }
  .island-viewport { position: relative; flex: 1; min-height: 0; overflow: hidden; border-radius: inherit; }
  .island-slide { display: flex; flex-direction: column; height: 100%; }
  .island-slide.neighbor { position: absolute; inset: 0; pointer-events: none; }
  .inline-actions { display: flex; gap: 3px; flex: none; align-items: center; }
  [data-open="true"] .inline-actions { display: none; }
  .inline-actions button { display: grid; place-items: center; height: 30px; width: 29px; border: 0; border-radius: 6px; background: #ffffff08; color: var(--white); padding: 0; font-size: .72rem; }
  .inline-actions button[aria-pressed="true"] { background: var(--widget-accent); border-color: var(--widget-accent); color: var(--panel); }
  .inline-actions button:disabled { opacity: .5; cursor: default; }
  .inline-actions input { width: clamp(45px, 7vw, 78px); margin: 0; accent-color: var(--widget-accent); }
  [data-open="false"] [data-widget="Media"].island-slide .inline-actions { display: contents; }
  [data-open="false"] [data-widget="Media"].island-slide .toggle { flex: 0 1 auto; max-width: 38%; }
  .inline-actions input[data-seek] { flex: 1 1 0; width: 0; min-width: 25px; }
  .inline-transport { display: flex; align-items: center; gap: 2px; flex: none; }
  .inline-transport button { width: 24px; background: transparent; }
  .inline-transport input[type="range"] { width: clamp(34px, 5vw, 47px); }
  .inline-actions input[type="number"] { width: 44px; border: 0; border-radius: 5px; padding: 3px; color: var(--white); background: #ffffff0d; font-size: .72rem; }
  .inline-actions .icon { width: 14px; height: 14px; }
  [data-open="false"] [data-widget="QuickSettings"].island-slide .summary { display: none; }
  [data-open="false"] [data-widget="QuickSettings"].island-slide .identity { font-size: .73rem; }
  [data-open="false"] [data-widget="Media"].island-slide .identity { display: none; }
  [data-open="false"] [data-widget="Media"].island-slide .summary { flex: 1; max-width: none; margin: 0; text-align: start; }
  .island :focus-visible { outline-color: var(--accent); outline-offset: -3px; }
  .island-header { display: flex; align-items: center; flex: 0 0 var(--island-compact-height); min-width: 0; padding: 0 var(--space-2); gap: var(--space-1); }
  .toggle { display: flex; align-items: center; gap: var(--space-2); flex: 1; min-width: 0; height: 38px; padding: 0 var(--space-2); border: 0; border-radius: 8px; color: inherit; background: transparent; text-align: left; }
  @media (hover: hover) {
    .island:hover .island-header { background: #ffffff0b; }
    .inline-actions button:hover { background: #ffffff1a; }
    .inline-actions button[aria-pressed="true"]:hover { background: color-mix(in srgb, var(--widget-accent) 85%, white); }
  }
  .icon { flex: none; width: 15px; height: 15px; vertical-align: middle; }
  .widget-icon { display: grid; place-items: center; flex: 0 0 24px; height: 24px; color: var(--widget-accent); }
  .widget-icon .icon { width: 17px; height: 17px; }
  .identity { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; font-size: .83rem; }
  .summary { flex: 0 1 auto; min-width: 0; max-width: 58%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--widget-accent); font-size: .82rem; font-weight: 600; font-variant-numeric: tabular-nums; margin-inline-start: auto; }
  .island-slide:is([data-widget="Clock"], [data-widget="Stopwatch"], [data-widget="Countdown"], [data-widget="Focus"]) .summary { font-size: 1rem; }
  .indicator { flex: none; color: var(--dim); transition: transform var(--motion); }
  [data-open="false"] .indicator { display: none; }
  [data-open="true"] .indicator { transform: rotate(180deg); }
  .expand { display: flex; flex: 1; min-height: 0; }
  .content { display: flex; flex: 1; flex-direction: column; min-width: 0; min-height: 0; padding: var(--space-2) var(--space-2) var(--space-1); }
  .page {
    flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: #686b77 transparent;
    border-radius: 9px;
    background: var(--panel-raised); padding: var(--space-2); overflow-wrap: anywhere;
  }
  [data-open="true"] .content { padding: 0 var(--space-3) var(--space-2); }
  [data-open="true"] .page { padding: var(--space-3); }
  .page :is(.week, .day-scale) { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; }
  .week { margin: 3px 0 0; padding: 0; list-style: none; }
  .week li { display: grid; gap: 3px; justify-items: center; padding: 3px 1px; border-radius: 5px; font-size: .72rem; color: var(--dim); }
  .week li b { font-weight: 550; color: var(--white); font-variant-numeric: tabular-nums; }
  .week [aria-current="date"] { background: var(--widget-accent); color: var(--panel); }
  .week [aria-current="date"] b { color: inherit; }
  .page.clock { grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 2px 8px; }
  .clock small { grid-column: 1 / -1; }
  .clock .week { grid-column: 1 / -1; padding-top: 4px; }
  .clock .date { text-align: right; }
  @media (max-width: 480px) { [data-open="true"] .clock { grid-template-columns: minmax(0, 1fr); } [data-open="true"] .clock .date { text-align: left; } }
  .day-scale { font-size: .66rem; font-variant-numeric: tabular-nums; color: var(--dim); margin-bottom: 2px; }
  .day-scale span:not(:first-child):not(:last-child) { text-align: center; }
  .day-scale span:last-child { text-align: end; }
  .sample-history { display: grid; gap: 5px; margin-top: 7px; }
  .sample-history small { color: var(--dim); font-size: .68rem; }
  .history-bars { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; align-items: end; gap: 3px; height: 29px; border-bottom: 1px solid var(--panel-line); }
  .history-bars span { background: color-mix(in srgb, var(--widget-accent) 36%, var(--panel-raised)); border-radius: 2px 2px 0 0; }
  .history-bars span:last-child { background: var(--widget-accent); }
  .forecast { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin: 7px 0 0; padding: 6px 0 0; list-style: none; }
  .forecast li { display: grid; grid-template-columns: auto auto; align-items: center; justify-content: center; gap: 2px 3px; font-size: .7rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  .forecast li time { grid-column: 1 / -1; text-align: center; }
  .forecast b { color: var(--white); font-weight: 550; }
  .forecast .icon { color: var(--widget-accent); }
  [data-open="false"] .forecast { margin-top: 4px; padding-top: 3px; }
  .sample-player { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; }
  .sample-player button { width: 29px; height: 29px; border: 0; border-radius: 6px; background: var(--widget-accent); color: var(--panel); font-size: .72rem; }
  .sample-player input { width: 100%; margin: 0; accent-color: var(--widget-accent); }
  .sample-player output { font-size: .72rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  .page:is([data-widget="Battery"], [data-widget="BluetoothBattery"], [data-widget="Storage"]) .rows div { padding-block: 5px; }
  .page[data-widget="Clock"] .week { background: #c2d9ff0a; border-radius: 6px; }
  .page[data-widget="DayProgress"] progress { height: 12px; }
  .page[data-widget="DayProgress"] output { color: var(--widget-accent); }
  .timer .timer-state { color: var(--widget-accent); font-size: .72rem; font-weight: 550; }
  .page.timer { gap: 4px; }
  .page[data-widget="Focus"] { background: radial-gradient(ellipse at 88% 0%, #6554a329, transparent 64%), var(--panel-raised); }
  .page[data-widget="Countdown"] { background: radial-gradient(ellipse at 88% 0%, #9561272e, transparent 64%), var(--panel-raised); }
  .page[data-widget="Stopwatch"] { background: repeating-linear-gradient(90deg, transparent 0 15px, #b1c9ff0a 15px 16px) top / 100% 6px no-repeat, var(--panel-raised); }
  .page[data-widget="SystemStats"] { background: repeating-linear-gradient(0deg, transparent 0 17px, #a8c6ff08 17px 18px), var(--panel-raised); }
  .page[data-widget="NetSpeed"] .history-bars { background: repeating-linear-gradient(0deg, #94dfec14 0 1px, transparent 1px 8px); }
  .page[data-widget="Audio"] .sample-volume { padding: 4px 7px; border: 1px solid var(--panel-line); border-radius: 8px; background: #c4baff0b; }
  .page:is([data-widget="Weather"], [data-widget="Battery"], [data-widget="BluetoothBattery"], [data-widget="Storage"], [data-widget="Audio"], [data-widget^="AiUsage"]) { background: transparent; }
  .weather-hero { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; }
  .weather-hero > .icon { width: 38px; height: 38px; color: var(--widget-accent); }
  .weather-hero strong, .device-hero strong, .balance strong { font-size: 1.65rem; font-weight: 580; letter-spacing: -.035em; }
  .weather-hero small, .device-hero small { display: block; color: var(--dim); font-size: .73rem; }
  .weather-hero .conditions { display: grid; text-align: end; gap: 4px; }
  .page .forecast { border: 0; padding: 8px 4px; margin-top: 9px; background: #ffffff07; border-radius: 9px; }
  .device-hero { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; margin-bottom: 12px; }
  .device-hero .icon { width: 26px; height: 26px; color: var(--widget-accent); }
  .device-hero strong { color: var(--widget-accent); }
  .usage-track { display: flex; height: 8px; border-radius: 6px; overflow: hidden; background: #ffffff15; }
  .usage-track span { background: var(--widget-accent); }
  .capacity-labels { display: flex; justify-content: space-between; gap: 8px; margin-top: 7px; font-size: .72rem; color: var(--dim); }
  .quota-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%,84px),1fr)); gap: 10px 12px; margin: 0; }
  .quota-grid div { display: grid; align-content: start; gap: 5px; min-width: 0; }
  .quota-grid dt { color: var(--dim); font-size: .72rem; }
  .quota-grid dd { margin: 0; font-size: 1.18rem; font-weight: 580; font-variant-numeric: tabular-nums; }
  .quota-grid .meter { height: 4px; margin: 0; }
  .quota-reset { font-size: .69rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  .quota-grid[data-pools] { grid-template-columns: repeat(2,minmax(0,1fr)); row-gap: 5px; }
  .quota-grid[data-pools] div { gap: 2px; }
  .quota-grid[data-pools] dd { font-size: .96rem; }
  .page[data-widget="AiUsageDeepSeek"] { --balance-accent: #879cff; }
  .page[data-widget="AiUsageOpenRouter"] { --balance-accent: #c4a8ff; }
  .balance {
    display: grid; grid-template-columns: 28px minmax(0,1fr); align-items: center; gap: 12px;
    min-height: 68px; padding: 10px 14px; overflow: hidden; border-radius: 12px;
    background: linear-gradient(112deg,
      color-mix(in srgb,var(--balance-accent) 17%,var(--panel-raised)),
      color-mix(in srgb,var(--balance-accent) 5%,var(--panel-raised)) 78%);
  }
  .balance > .icon { width: 24px; height: 24px; color: var(--balance-accent); }
  .balance > div { min-width: 0; }
  .balance strong { display: block; color: var(--white); font-size: 1.52rem; font-weight: 650; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .page[data-widget="Media"] { background: linear-gradient(140deg, #352336, #1c1a24 64%); }
  .page[data-widget="Media"] .media-art { border: 0; }
  .page[data-widget="Media"] .sample-player button { border-radius: 50%; }
  .page[data-widget="Media"] .sample-player { grid-template-columns: minmax(0,1fr) auto; gap: 5px 10px; }
  .media-transport { display: flex; align-items: center; gap: 7px; }
  .media-volume { display: flex; align-items: center; gap: 6px; justify-self: end; font-size: .72rem; color: var(--dim); }
  .media-volume input { width: min(72px, 15vw); }
  .sample-player .media-transport button { display: grid; place-items: center; background: #ffffff16; color: var(--white); }
  .sample-player .media-transport [data-play] { background: var(--widget-accent); color: var(--panel); }
  .page[data-widget="Audio"] .sample-volume { border: 0; padding: 3px 8px; }
  [data-open="true"] .page[data-widget="Audio"] { padding-block: 1px; }
  .page[data-widget="Audio"] .sample-volume output { color: var(--widget-accent); font-weight: 650; }
  .mixer-devices { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; margin-top: 5px; }
  .mixer-devices label, .mixer-apps h3 { display: grid; gap: 2px; font-size: .72rem; color: var(--dim); font-weight: 550; }
  .page .mixer-devices select { color-scheme: dark; background: #ffffff09; color: var(--white); border-color: var(--panel-line); padding: 3px 5px; font-size: .77rem; }
  .page .mixer-devices option { background: var(--panel); }
  .mixer-apps { margin-top: 5px; }
  .mixer-apps h3 { margin: 0 0 2px; }
  .mixer-apps .level-row { min-height: 19px; }
  .level-row { display: grid; grid-template-columns: minmax(70px,1fr) minmax(45px,1.1fr) 32px; align-items: center; gap: 7px; min-height: 24px; font-size: .74rem; }
  .level-row input { width: 100%; min-width: 0; margin: 0; accent-color: var(--widget-accent); }
  .level-row output { text-align: end; color: var(--dim); font-variant-numeric: tabular-nums; }
  .page.quick-panel { display: flex; flex-direction: column; gap: 5px; overflow: hidden; padding-top: 2px; }
  .quick-panel .quick-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
  .quick-panel .tiles { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 4px; padding-right: 4px; }
  .quick-panel .tiles button { min-height: 38px; display: flex; justify-content: start; text-align: start; gap: 5px; padding: 4px 5px; border: 0; font-size: .70rem; }
  .quick-panel .tiles button:disabled { opacity: .48; cursor: default; }
  .quick-panel .tiles .icon { width: 14px; height: 14px; }
  .quick-levels { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 5px 12px; }
  .quick-levels .level-row { grid-template-columns: auto minmax(25px,1fr) 30px; gap: 4px; }
  .quick-details { padding: 2px 4px; }
  .quick-details button { font: inherit; padding: 3px 6px; border: 0; border-radius: 5px; background: #ffffff0e; color: var(--white); cursor: pointer; }
  .quick-details h3 { display: inline; margin-inline-start: 8px; font-size: .82rem; }
  .quick-details p { margin: 9px 0; color: var(--dim); font-size: .76rem; }
  .quick-details label { display: flex; gap: 6px; align-items: center; min-height: 24px; font-size: .78rem; }
  .quick-details input { accent-color: var(--widget-accent); }
  @media (max-width: 440px) { .weather-hero { gap: 6px; } .weather-hero > .icon { width: 26px; height: 26px; } }
  .clock, .timer, .progress-page { display: grid; align-content: safe center; gap: 6px; }
  .clock small, .timer small { color: var(--widget-accent); font-weight: 600; }
  .clock time, .timer output, .progress-page output { color: var(--white); font-size: 1.85rem; line-height: 1.05; font-weight: 600; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
  [data-open="true"] :is(.clock time, .timer output, .progress-page output) { font-size: clamp(2.3rem, 6vw, 3.5rem); }
  .date, .note { color: var(--dim); font-size: .82rem; }
  .note { margin: 8px 0 0; line-height: 1.4; }
  .readings { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 65px), 1fr)); gap: 5px; margin: 0; }
  .readings div { padding: 5px 6px; border: 1px solid var(--panel-line); border-radius: 6px; min-width: 0; background: #0d0f152e; }
  .readings dt { color: var(--dim); font-size: .69rem; }
  .readings dd { margin: 3px 0 0; font-size: .88rem; font-weight: 550; font-variant-numeric: tabular-nums; }
  .page[data-widget="SystemStats"] .readings { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .page[data-widget="SystemStats"] .readings div { grid-column: span 2; border: 0; border-bottom: 1px solid var(--panel-line); border-radius: 0; background: transparent; }
  .page[data-widget="SystemStats"] .readings div:nth-child(n+4) { grid-column: span 3; }
  .page[data-widget="NetSpeed"] .readings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  [data-open="true"] .readings div { padding: 9px; }
  [data-open="true"] .readings dd { font-size: 1.15rem; }
  [data-open="true"] .page[data-widget="SystemStats"] .readings div { padding-block: 5px; }
  .rows { margin: 0; }
  .rows div { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--panel-line); font-size: .8rem; }
  .rows div:last-child { border-bottom: 0; }
  .rows dd { margin: 0; color: var(--dim); text-align: end; }
  .meter { appearance: none; display: block; width: 100%; height: 3px; margin: 5px 0 0; border: 0; border-radius: 9px; background: var(--panel-line); }
  .meter::-webkit-meter-bar { height: 3px; border: 0; border-radius: 9px; background: var(--panel-line); }
  .meter::-webkit-meter-optimum-value { background: var(--widget-accent); border-radius: 9px; }
  .meter::-moz-meter-bar { background: var(--widget-accent); border-radius: 9px; }
  .rows:has(.meter) div { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
  .rows .meter { grid-column: 1 / -1; }
  [data-open="true"] .rows div { padding: 9px 0; }
  [data-open="true"] .page[data-widget="Audio"] .rows div { padding-block: 4px; }
  [data-open="true"] .meter, [data-open="true"] .meter::-webkit-meter-bar { height: 5px; }
  [data-open="false"] .readings dd { margin-top: 2px; }

  function connectTimer(page, direction) {
    const output = page.querySelector('output');
    const input = page.querySelector('input');
    const progress = page.querySelector('progress');
    const start = page.querySelector('[data-action="start"]');
    const state = page.querySelector('.timer-state');
    const limit = () => input ? input.valueAsNumber * 60 : 0;
    let base = limit();
    let startedAt = null;
    function tick() {
      const elapsed = startedAt === null ? 0 : (performance.now() - startedAt) / 1000;
      const seconds = direction === 'up' ? Math.floor(base + elapsed) : Math.max(0, Math.ceil(base - elapsed));
      if (direction === 'down' && seconds === 0 && startedAt !== null) {
        base = 0;
        startedAt = null;
        start.textContent = 'Başlat';
        input.disabled = false;
      }
      const value = [Math.floor(seconds / 60), seconds % 60].map(part => String(part).padStart(2, '0')).join(':');
      if (output.value !== value) output.value = value;
      const label = startedAt !== null ? 'Çalışıyor' : start.textContent === 'Devam et' ? 'Duraklatıldı' :
        direction === 'down' && seconds === 0 ? 'Süre doldu' : 'Hazır';
      if (state.textContent !== label) state.textContent = label;
      if (progress && input.validity.valid && limit() > 0) progress.value = 1 - seconds / limit();
      return value;
    }
    function reset() {
      base = limit();
      startedAt = null;
      if (input) input.disabled = false;
      start.textContent = 'Başlat';
      tick();
    }
    input?.addEventListener('input', () => {
      start.disabled = !input.validity.valid;
      if (!start.disabled) reset();
    });
    start.addEventListener('click', () => {
      const now = performance.now();
      if (startedAt === null) {
        if (input && base <= 0) base = limit();
        startedAt = now;
        start.textContent = 'Duraklat';
      } else {
        const elapsed = (now - startedAt) / 1000;
        base = input ? Math.max(0, base - elapsed) : base + elapsed;
        startedAt = null;
        start.textContent = 'Devam et';
      }
      if (input) input.disabled = startedAt !== null;
      tick();
    });
    page.querySelector('[data-action="reset"]').addEventListener('click', () => {
      if (input && !input.validity.valid) input.reportValidity();
      else reset();
    });
    return tick;
  }
  function createMonitor(index, initialPage, expanded) {

    const tracks = [

    let trackIndex = 0;

        audioContext = new AudioContext();
        audioGain = audioContext.createGain();
        audioGain.connect(audioContext.destination);
      }
      const root = tracks[trackIndex].root;
      if (loopRoot !== root) {
        const rate = audioContext.sampleRate;
        loop = audioContext.createBuffer(1, rate * 4, rate);
        const data = loop.getChannelData(0);
        const notes = [0, 7, 12, 15, 7, 10, 15, 12];
        for (let index = 0; index < data.length; index++) {
          const time = index / rate;
          const beat = Math.floor(time * 2);
          const phase = time - beat / 2;
          const frequency = 440 * 2 ** ((root + notes[beat] - 69) / 12);
          const envelope = Math.min(1, phase / .035) * (1 - phase * 2) ** 2;

    function update() {

        gesture.widget = previewNeighbor(direction);
      }
      const width = viewport.clientWidth;
      gesture.offset = Math.max(-width, Math.min(width, dx));
      slide.style.transform = 'translateX(' + gesture.offset + 'px)';
      neighbor.style.transform = 'translateX(' + (gesture.offset + direction * width) + 'px)';
    });
    function finishGesture(event) {
      if (!gesture || gesture.id !== event.pointerId) return;
      const { active, direction, offset, widget } = gesture;
      gesture = undefined;
      delete island.dataset.dragging;
      if (!active) return;
      const width = viewport.clientWidth;
      const commit = event.type === 'pointerup' && Math.abs(offset) >= Math.max(36, width * .18);
      suppressDragClick = event.type === 'pointerup';
      if (reduceMotion.matches) {
        if (commit) showPage(widget, true, true, direction, false);
        else clearSlide();
        return;
      }
      const destination = commit ? -direction * width : 0;
      const options = { duration: 180, easing: 'cubic-bezier(.23,1,.32,1)', fill: 'forwards' };
      const animateSlide = (element, from, to) => element.animate(
        [{ transform: 'translateX(' + from + 'px)' }, { transform: 'translateX(' + to + 'px)' }], options
      );
      const animation = animateSlide(slide, offset, destination);
      animateSlide(neighbor, offset + direction * width, destination + direction * width);
      settle = animation;
      animation.onfinish = () => {
        if (settle !== animation) return;
        if (commit) showPage(widget, true, true, direction, false);
        else clearSlide();
      };
    }
    island.addEventListener('pointerup', finishGesture);
    island.addEventListener('pointercancel', finishGesture);
    island.addEventListener('lostpointercapture', finishGesture);
    island.addEventListener('click', event => {
      if (!suppressDragClick || event.detail === 0) return;
      suppressDragClick = false;
      event.stopImmediatePropagation();
    }, true);

    picker.addEventListener('change', () => {
      placement.value = positions.get(picker.value);
      if (placement.value === 'island') showPage(picker.value, true);
    });
    placement.addEventListener('change', () => {
      const widget = picker.value;
      positions.set(widget, placement.value);
      const dockItems = [...positions].filter(([, position]) => position === 'dock');
      dock.replaceChildren(...dockItems.map(([id]) => {
        const item = document.createElement('span');
        const definition = catalog.get(id);
        item.textContent = definition.short ?? definition.name;
        if (id === 'Clock') item.dataset.clock = '';
        return item;
      }));
      dock.hidden = dockItems.length === 0;
      const pages = islandPages();
      const next = placement.value === 'island' ? widget : pages.includes(selected) ? selected : pages[0];
      showPage(next, false, false);
    });

    setOpen(expanded);
    showPage(initialPage);
    screens.append(monitor);
    return update;
  }

  const monitors = [createMonitor(1, 'Clock', true), createMonitor(2, 'Media', false)];
  setInterval(() => monitors.forEach(update => update()), 250);
</script>
