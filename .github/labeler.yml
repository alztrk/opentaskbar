area/core:
  - changed-files:
      - any-glob-to-any-file:
          - 'Rust-Port/crates/**'
          - 'Rust-Port/Cargo.toml'
          - 'tools/watchdog/**'

area/scripts:
  - changed-files:
      - any-glob-to-any-file:
          - 'scripts/**'

area/ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'

area/docs:
  - changed-files:
      - any-glob-to-any-file:
          - 'README.md'
          - 'CHANGELOG.md'
          - 'LICENSE'
          - 'docs/**'
          - '.github/CONTRIBUTING.md'

area/tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'Rust-Port/crates/**/tests/**'
          - 'scripts/check-*.ps1'
