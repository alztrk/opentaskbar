name: Bug Report
description: Report a bug or unexpected behavior in OpenTaskbar
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please note that **all issue titles and descriptions must be written in English** so that the entire community and maintainers can participate.

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened and why it is incorrect...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open OpenTaskbar
        2. Click on ...
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: A clear description of what you expected to see...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment & System Information
      description: Provide details about your system.
      value: |
        - OS: Windows 11 / Windows 10 (Build number: e.g. 26100)
        - OpenTaskbar Version: (e.g. 0.3.5 or commit hash)
        - Display Resolution & Scale: (e.g. 2560x1440 @ 125%)
        - Multi-monitor Setup: (Single / Dual / Triple)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Paste any relevant lines from `%LOCALAPPDATA%\OpenTaskbar\log.txt` if available.
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional Context / Screenshots
      description: Add any other context, screenshots, or screen recordings about the problem here.
