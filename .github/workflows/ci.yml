name: Continuous Integration

# Rust-only gate. rust-ci.yml carries the extended checks (watchdog PE,
# 32-bit build, locale key parity); this workflow guarantees that every push
# and PR is formatted, linted, tested and built even when path filters in the
# extended workflow do not fire.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust test suite
        run: cargo test --workspace

      - name: Release build
        run: cargo build --workspace --release
