name: Stale Issues & PRs

on:
  schedule:
    - cron: '31 3 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          days-before-stale: 60
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          # Issue templates apply bug/enhancement to nearly every issue; exempting
          # them made the bot a no-op. Keep only the intentional exemptions.
          exempt-issue-labels: 'pinned,security'
          exempt-pr-labels: 'pinned,security'
          stale-issue-message: >
            This issue has had no activity for 60 days and will be closed in 7 days
            unless there is new activity. Please comment if it is still relevant.
          stale-pr-message: >
            This pull request has had no activity for 60 days and will be closed in 7 days
            unless there is new activity.
          close-issue-message: 'Closing due to inactivity. Feel free to reopen if still relevant.'
          close-pr-message: 'Closing due to inactivity. Feel free to reopen if still relevant.'
