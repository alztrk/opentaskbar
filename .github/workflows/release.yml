name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v0.2.8)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-release:
    name: Build & Publish Release Assets
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build portable single-file executable
        shell: pwsh
        run: |
          & "scripts/publish-portable.ps1" -OutputDir dist
          & "scripts/check-portable.ps1" -OutputDir dist

      - name: Determine release tag
        id: release_info
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "${{ inputs.tag_name }}" }
          if (-not $tag) { $tag = "v0.2.8" }
          "TAG_NAME=$tag" >> $env:GITHUB_ENV

      - name: Package release archive
        shell: pwsh
        run: |
          $zipName = "OpenTaskbar-${{ env.TAG_NAME }}-win-x64.zip"
          Compress-Archive -Path "dist/OpenTaskbar.exe", "LICENSE", "README.md" -DestinationPath $zipName
          
          # Generate SHA256 checksums
          $exeHash = (Get-FileHash -Path "dist/OpenTaskbar.exe" -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          
          $checksumContent = @"
          $exeHash *OpenTaskbar.exe
          $zipHash *$zipName
          "@
          Set-Content -Path "checksums.txt" -Value $checksumContent

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          files: |
            dist/OpenTaskbar.exe
            OpenTaskbar-*-win-x64.zip
            checksums.txt
