name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v0.4.0 or v0.4.0-rc.1)'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a prerelease'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, verify and package
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.release_info.outputs.tag_name }}
      version: ${{ steps.release_info.outputs.version }}
      is_prerelease: ${{ steps.release_info.outputs.is_prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Gate before any build: tag <-> Cargo workspace version <-> Rust MSIX.
      - name: Determine release tag and verify version gate
        id: release_info
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } elseif ($env:GITHUB_REF_TYPE -eq 'branch' -and $env:GITHUB_REF_NAME -match '^release/(v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            $Matches[1]
          } else {
            "${{ inputs.tag_name }}"
          }
          if ($tag -notmatch '^v(?<base>\d+\.\d+\.\d+)(?<pre>-[0-9A-Za-z.-]+)?$') {
            throw "Release tag must look like v0.4.0 or v0.4.0-rc.1."
          }
          $version = $Matches['base']
          $isPre = -not [string]::IsNullOrEmpty($Matches['pre'])
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and "${{ inputs.prerelease }}" -eq 'true') {
            $isPre = $true
          }
          & "scripts/check-release-version.ps1" -Tag $tag
          "tag_name=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "is_prerelease=$($isPre.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Set up Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc i686-pc-windows-msvc

      - name: Run Rust workspace tests
        run: cargo test --workspace

      - name: Build and verify Rust portable executables (x64 + x86)
        shell: pwsh
        run: |
          & "scripts/publish-portable.ps1" -Runtime win-x64 -OutputDir release
          & "scripts/check-portable.ps1" -OutputDir release -ExecutableName OpenTaskbar-x64.exe
          & "scripts/publish-portable.ps1" -Runtime win-x86 -OutputDir release
          & "scripts/check-portable.ps1" -OutputDir release -ExecutableName OpenTaskbar-x86.exe

      - name: Package Rust release artifacts, notes, checksums and manifest
        shell: pwsh
        run: |
          & "scripts/package-rust-release.ps1" `
              -Tag '${{ steps.release_info.outputs.tag_name }}' `
              -Commit '${{ github.sha }}' `
              -Prerelease:('${{ steps.release_info.outputs.is_prerelease }}' -eq 'true') `
              -OutputDir release

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: |
            release/OpenTaskbar-v*-win-*.exe
            release/OpenTaskbar-v*-win-*.zip
            release/checksums.txt
            release/release-manifest.json
            release/release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      # 'secrets' is not available in step-level `if`; expose it as a job env instead.
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

    steps:
      - name: Download release assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-assets
          path: downloaded

      - name: Restore release/ layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Get-ChildItem -LiteralPath downloaded -Recurse -File | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path release $_.Name) -Force
          }
          $required = @('checksums.txt', 'release-manifest.json', 'release-notes.md')
          foreach ($name in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path release $name) -PathType Leaf)) {
              throw "Missing release asset: $name"
            }
          }
          if (-not (Get-ChildItem -LiteralPath release -Filter 'OpenTaskbar-*.zip' -File)) {
            throw 'No Rust release ZIPs were downloaded.'
          }

      # Sigstore-backed SLSA provenance. The checksums file already uses the
      # `<sha256> *<name>` format expected by actions/attest's subject-checksums input.
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release/checksums.txt

      - name: Optional VirusTotal scan (report only)
        if: ${{ env.VIRUSTOTAL_API_KEY != '' }}
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem -LiteralPath release -Filter 'OpenTaskbar-*.zip' -File) {
            try {
              $response = & curl -sS -F "file=@$($file.FullName)" -H "x-apikey: $env:VIRUSTOTAL_API_KEY" `
                'https://www.virustotal.com/api/v3/files' | ConvertFrom-Json
              Write-Host "Submitted $($file.Name) to VirusTotal: $($response.data.id)"
            } catch {
              Write-Warning "VirusTotal submission failed for $($file.Name): $_"
            }
          }

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@40c2ca6ddd77ba2a30bbea8f67409c0f76868d67 # v3
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
          body_path: release/release-notes.md
          generate_release_notes: false
          overwrite_files: true
          files: |
            release/OpenTaskbar-v*-win-*.exe
            release/OpenTaskbar-v*-win-*.zip
            release/checksums.txt
            release/release-manifest.json

      - name: Remove stale release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag_name }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not read release assets for $env:RELEASE_TAG." }

          $expected = @(
            "OpenTaskbar-$env:RELEASE_TAG-win-x64.exe",
            "OpenTaskbar-$env:RELEASE_TAG-win-x64.zip",
            "OpenTaskbar-$env:RELEASE_TAG-win-x86.exe",
            "OpenTaskbar-$env:RELEASE_TAG-win-x86.zip",
            'checksums.txt',
            'release-manifest.json'
          )
          $assetNames = @($release.assets | ForEach-Object name)
          $missing = @($expected | Where-Object { $_ -notin $assetNames })
          if ($missing.Count -gt 0) {
            throw "Release $env:RELEASE_TAG is missing expected assets: $($missing -join ', ')."
          }

          $staleAssets = @($release.assets | Where-Object { $_.name -notin $expected })
          foreach ($asset in $staleAssets) {
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)"
            if ($LASTEXITCODE -ne 0) { throw "Could not remove stale release asset $($asset.name)." }
            Write-Host "Removed stale release asset: $($asset.name)"
          }
