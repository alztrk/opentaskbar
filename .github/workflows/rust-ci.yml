name: Rust Port CI

# Runs on every branch (not just master) so integration worktrees and feature
# branches get the same extended checks as the eventual merge onto master.
# The common fmt/clippy/test/build gate lives in ci.yml only: running it here
# too doubled CI time and required-check noise for every code change.
on:
  push:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "resources/fonts/**"
      - "resources/assets/**"
      - "resources/themes/**"
      # Frozen locale reference catalogs are compared with the embedded Rust
      # catalogs by scripts/check-locale-parity.ps1.
      - "tests/reference/locales/**"
      - "scripts/**"
      # The native helper is embedded via build.rs/include_bytes!, so a C-only
      # change must rebuild and re-verify both architectures.
      - "tools/watchdog/**"
      - "packaging/msix/AppxManifest.Rust.xml"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "resources/fonts/**"
      - "resources/assets/**"
      - "resources/themes/**"
      - "tests/reference/locales/**"
      - "scripts/**"
      - "tools/watchdog/**"
      - "packaging/msix/AppxManifest.Rust.xml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog-arch:
    name: i686 portable build with embedded watchdog
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Toolchain (i686 target)
        working-directory: .
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: i686-embedded-watchdog

      # Cargo runs crates/opentaskbar-shell/build.rs, which builds the watchdog
      # for this target, validates its PE machine, and embeds it in the app EXE.
      - name: Build Rust workspace for i686
        run: cargo build --workspace --target i686-pc-windows-msvc

      - name: Verify x86 portable EXE (embedded watchdog included)
        working-directory: .
        shell: pwsh
        run: |
          & 'scripts/publish-portable.ps1' -Runtime win-x86 -OutputDir artifacts/release -SkipTargetInstall
          & 'scripts/check-portable.ps1' -OutputDir artifacts/release -ExecutableName OpenTaskbar-x86.exe

  locale-parity:
    name: Locale key parity (14 languages)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify frozen reference and Rust catalog key parity
        shell: pwsh
        working-directory: .
        run: ./scripts/check-locale-parity.ps1

      # The locale-parity script does not read the MSIX manifest. Compare the
      # declared Resource Languages with the embedded catalogs here so a new
      # locale cannot silently be missing from the Store package.
      - name: Verify MSIX manifest declares every embedded locale
        shell: pwsh
        working-directory: .
        run: |
          [xml]$manifest = Get-Content -Raw -LiteralPath 'packaging/msix/AppxManifest.Rust.xml'
          $declared = @($manifest.Package.Resources.Resource | ForEach-Object { $_.Language.ToLowerInvariant() } | Sort-Object)
          $embedded = @(Get-ChildItem -LiteralPath 'crates/opentaskbar-core/locales' -Filter '*.json' -File |
              ForEach-Object { $_.BaseName.ToLowerInvariant() } | Sort-Object)
          if ($embedded.Count -ne 14) { throw "Expected 14 embedded catalogs, found $($embedded.Count)." }
          $missing = @($embedded | Where-Object { $_ -notin $declared })
          $extra = @($declared | Where-Object { $_ -notin $embedded })
          if ($missing.Count -gt 0 -or $extra.Count -gt 0) {
              throw "MSIX languages drifted: missing=$($missing -join ',') extra=$($extra -join ',')"
          }
          Write-Host "MSIX declares all $($embedded.Count) embedded locales." -ForegroundColor Green
