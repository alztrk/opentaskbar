name: Rust Port CI

# Runs on every branch (not just rust-port) so integration worktrees and feature
# branches get the same gate as the eventual merge onto rust-port/master.
on:
  push:
    paths:
      - "Rust-Port/**"
      - "scripts/check-locale-parity.ps1"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "Rust-Port/**"
      - "scripts/check-locale-parity.ps1"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: Rust-Port

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Rust-Port
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --workspace --release

  locale-parity:
    name: Locale key parity (14 languages)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare C# and Rust catalog key sets
        shell: pwsh
        working-directory: .
        run: ./scripts/check-locale-parity.ps1
