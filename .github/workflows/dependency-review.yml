name: Dependency Review

on:
  # No path filter: member-crate Cargo.toml changes (and dependency updates
  # that do not touch Cargo.lock) must still pass the security gate.
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5
        with:
          fail-on-severity: high
