name: CodeQL

# No branch filter: every push, PR and the weekly schedule scan the Rust
# workspace and the native C watchdog used by the Rust shell.
on:
  push:
  pull_request:
  schedule:
    - cron: '27 4 * * 1'

permissions:
  contents: read

jobs:
  analyze-rust:
    name: Analyze (Rust)
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          languages: rust
          queries: security-extended
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          category: '/language:rust'

  analyze-watchdog:
    name: Analyze (C/C++)
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          languages: c-cpp
          queries: security-extended
          build-mode: manual

      - name: Build native watchdog (x64, no fallback)
        shell: pwsh
        working-directory: tools/watchdog
        run: |
          $out = '../../artifacts/tmp/watchdog-codeql'
          & ./build.ps1 -Architecture x64 -OutputDir $out -Force -NoFallback
          if ($LASTEXITCODE -ne 0) { throw "watchdog build failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath (Join-Path $out 'OpenTaskbarWatchdog.exe') -PathType Leaf)) {
            throw 'watchdog build did not produce OpenTaskbarWatchdog.exe'
          }

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          category: '/language:c-cpp'
